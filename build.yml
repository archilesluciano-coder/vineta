name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Crear proyecto Android
        run: |
          set -e
          mkdir -p app/src/main/assets/lib
          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "Vineta"
          include ':app'
          EOF
          cat > build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.5.2' apply false }
          EOF
          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2g
          EOF
          mkdir -p app
          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.vineta.app'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.vineta.app'
                  minSdk 29
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies { implementation 'androidx.webkit:webkit:1.11.0' }
          EOF
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:label="Viñeta"
                  android:icon="@drawable/ic_launcher"
                  android:allowBackup="true"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden|smallestScreenSize|screenLayout">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          mkdir -p app/src/main/res/drawable
          cat > app/src/main/res/drawable/ic_launcher.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#0D1120" android:pathData="M0,0h108v108h-108z" />
              <path android:fillColor="#EEF0F7" android:pathData="M24,24h38v28h-38z" />
              <path android:fillColor="#3CC8EC" android:pathData="M66,24h18v28h-18z" />
              <path android:fillColor="#3CC8EC" android:pathData="M24,56h18v28h-18z" />
              <path android:fillColor="#EEF0F7" android:pathData="M46,56h38v28h-38z" />
          </vector>
          EOF
          mkdir -p app/src/main/java/com/vineta/app
          cat > app/src/main/java/com/vineta/app/MainActivity.java <<'EOF'
          package com.vineta.app;

          import android.app.Activity;
          import android.content.ContentValues;
          import android.content.Intent;
          import android.graphics.Color;
          import android.net.Uri;
          import android.os.Bundle;
          import android.os.Environment;
          import android.provider.MediaStore;
          import android.util.Base64;
          import android.webkit.JavascriptInterface;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Toast;
          import androidx.webkit.WebViewAssetLoader;
          import java.io.OutputStream;

          public class MainActivity extends Activity {
              private static final int REQ_PICK = 7;
              private WebView web;
              private ValueCallback<Uri[]> picker;
              private OutputStream out;
              private String outName = "";

              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  getWindow().setStatusBarColor(Color.parseColor("#0D1120"));
                  getWindow().setNavigationBarColor(Color.parseColor("#0D1120"));
                  web = new WebView(this);
                  web.setBackgroundColor(Color.parseColor("#0D1120"));
                  setContentView(web);

                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setAllowFileAccess(false);

                  final WebViewAssetLoader loader = new WebViewAssetLoader.Builder()
                          .addPathHandler("/assets/", new WebViewAssetLoader.AssetsPathHandler(this))
                          .build();
                  web.setWebViewClient(new WebViewClient() {
                      @Override
                      public WebResourceResponse shouldInterceptRequest(WebView v, WebResourceRequest r) {
                          return loader.shouldInterceptRequest(r.getUrl());
                      }
                  });
                  web.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public boolean onShowFileChooser(WebView v, ValueCallback<Uri[]> cb, FileChooserParams p) {
                          if (picker != null) picker.onReceiveValue(null);
                          picker = cb;
                          try {
                              startActivityForResult(p.createIntent(), REQ_PICK);
                          } catch (Exception e) {
                              picker = null;
                              return false;
                          }
                          return true;
                      }
                  });
                  web.addJavascriptInterface(new Bridge(), "Android");
                  web.loadUrl("https://appassets.androidplatform.net/assets/index.html");
              }

              @Override
              protected void onActivityResult(int rc, int res, Intent d) {
                  if (rc == REQ_PICK && picker != null) {
                      picker.onReceiveValue(WebChromeClient.FileChooserParams.parseResult(res, d));
                      picker = null;
                  } else {
                      super.onActivityResult(rc, res, d);
                  }
              }

              @Override
              public void onBackPressed() {
                  web.evaluateJavascript(
                      "(function(){var r=document.getElementById('reader');if(r&&!r.hidden){closeReader();return 1}return 0})()",
                      v -> { if (!"1".equals(v)) finish(); });
              }

              /** Guarda en la carpeta Descargas, recibiendo el archivo por trozos desde JavaScript. */
              private class Bridge {
                  @JavascriptInterface
                  public void begin(String name, String mime) throws Exception {
                      outName = name;
                      ContentValues v = new ContentValues();
                      v.put(MediaStore.Downloads.DISPLAY_NAME, name);
                      v.put(MediaStore.Downloads.MIME_TYPE, mime);
                      v.put(MediaStore.Downloads.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS);
                      Uri uri = getContentResolver().insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, v);
                      out = getContentResolver().openOutputStream(uri);
                  }

                  @JavascriptInterface
                  public void chunk(String b64) throws Exception {
                      out.write(Base64.decode(b64, Base64.DEFAULT));
                  }

                  @JavascriptInterface
                  public void end() throws Exception {
                      out.close();
                      out = null;
                      final String n = outName;
                      runOnUiThread(() -> Toast.makeText(MainActivity.this,
                              "Guardado en Descargas: " + n, Toast.LENGTH_LONG).show());
                  }
              }
          }
          EOF
      - name: Preparar librerias sin conexion
        run: |
          set -e
          mkdir -p lib-build && cd lib-build
          npm init -y > /dev/null
          npm install jszip@3.10.1 node-unrar-js@2.0.2 esbuild
          cd ..
          cp lib-build/node_modules/jszip/dist/jszip.min.js app/src/main/assets/lib/jszip.min.js
          cp lib-build/node_modules/node-unrar-js/esm/js/unrar.wasm app/src/main/assets/lib/unrar.wasm
          cd lib-build
          npx esbuild node_modules/node-unrar-js/esm/index.js --bundle --format=iife --global-name=UnrarJs --platform=browser --external:fs --external:path --external:fs/promises --outfile=../app/src/main/assets/lib/unrar.bundle.js || echo "" > ../app/src/main/assets/lib/unrar.bundle.js
          cd ..
          cp index.html app/src/main/assets/index.html
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compilar APK
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Vineta-apk
          path: app/build/outputs/apk/debug/app-debug.apk
